<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TerrainComm RF Planner & Agent</title>
<!-- Leaflet CSS & JS for Interactive Map -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Material Symbols for A2UI icons -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<!-- Google Fonts -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

<style>
  :root {
    --primary: #1a73e8;
    --primary-dark: #1557b0;
    --bg-dark: #0f172a;
    --card-bg: #1e293b;
    --border: #334155;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #38bdf8;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg-dark);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  header {
    background: #1e293b;
    border-bottom: 1px solid var(--border);
    padding: 0.8rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  header h1 {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .status-badge {
    background: rgba(56, 189, 248, 0.1);
    color: var(--accent);
    border: 1px solid rgba(56, 189, 248, 0.3);
    padding: 0.25rem 0.6rem;
    border-radius: 9999px;
    font-size: 0.75rem;
    font-weight: 600;
  }

  /* Main Split Layout */
  .app-container {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Left Panel: Map & Transmitter Specs */
  .left-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    background: #0f172a;
    min-width: 380px;
  }

  #map {
    height: 45vh;
    width: 100%;
    background: #1e293b;
  }

  .specs-container {
    flex: 1;
    padding: 1.2rem;
    overflow-y: auto;
    background: #1e293b;
    border-top: 1px solid var(--border);
  }

  .section-title {
    font-size: 0.95rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--accent);
    margin-top: 0;
    margin-bottom: 0.8rem;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.8rem;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }

  .form-group.full-width {
    grid-column: span 2;
  }

  label {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-muted);
  }

  input, select {
    background: #0f172a;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.5rem 0.75rem;
    color: #fff;
    font-size: 0.9rem;
  }

  input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }

  .btn-group {
    display: flex;
    gap: 0.5rem;
    margin-top: 1rem;
  }

  .btn {
    flex: 1;
    padding: 0.6rem 0.8rem;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-primary {
    background: var(--primary);
    color: #fff;
  }

  .btn-primary:hover {
    background: var(--primary-dark);
  }

  .btn-secondary {
    background: #334155;
    color: #f8fafc;
  }

  .btn-secondary:hover {
    background: #475569;
  }

  /* Right Panel: Agent Chat & A2UI Output */
  .right-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #0f172a;
    min-width: 400px;
  }

  #chat-log {
    flex: 1;
    overflow-y: auto;
    padding: 1.2rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .msg {
    display: flex;
    flex-direction: column;
    max-width: 85%;
  }

  .msg.user {
    align-self: flex-end;
  }

  .msg.agent {
    align-self: flex-start;
  }

  .bubble {
    padding: 0.8rem 1rem;
    border-radius: 12px;
    background: #1e293b;
    border: 1px solid var(--border);
    font-size: 0.95rem;
    line-height: 1.5;
    white-space: pre-wrap;
  }

  .msg.user .bubble {
    background: var(--primary);
    color: #fff;
    border: none;
  }

  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    max-width: 100%;
    white-space: normal;
  }

  #chat-form {
    display: flex;
    gap: 0.5rem;
    padding: 1rem;
    border-top: 1px solid var(--border);
    background: #1e293b;
  }

  #chat-input {
    flex: 1;
    background: #0f172a;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    color: #fff;
    font-size: 0.95rem;
  }

  #chat-submit {
    padding: 0.75rem 1.25rem;
    border: none;
    border-radius: 8px;
    background: var(--primary);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
  }

  /* --- A2UI component styles --- */
  .a2card {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
    background: #1e293b;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    max-width: 100%;
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.6rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.4; color: #f8fafc; }
  .a2text.a2-h1 { font-size: 1.4rem; font-weight: 700; color: var(--accent); }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 700; color: var(--accent); }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; }
  .a2text.a2-caption { font-size: 0.85rem; color: var(--text-muted); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.5rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 8px; display: block; border: 1px solid var(--border); margin-top: 0.5rem; }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; vertical-align: middle; color: var(--accent); }
</style>
</head>
<body>

<header>
  <h1>
    <span class="material-symbols-outlined">cell_tower</span>
    TerrainComm RF Planner
  </h1>
  <span class="status-badge">A2A Agent Connected</span>
</header>

<div class="app-container">
  <!-- Left Panel: Interactive Map & Transmitter Specs -->
  <div class="left-panel">
    <div id="map"></div>
    <div class="specs-container">
      <div class="section-title">Transmitter Specifications</div>
      <form id="tx-form">
        <div class="form-grid">
          <div class="form-group full-width">
            <label for="location">Location (MGRS or Lat, Lon)</label>
            <input type="text" id="location" value="18SUJ23456789" placeholder="e.g. 18SUJ23456789 or 38.8895, -77.0352">
          </div>
          <div class="form-group">
            <label for="frequency">Frequency (MHz)</label>
            <input type="number" id="frequency" value="5800" step="10">
          </div>
          <div class="form-group">
            <label for="power">Tx Power (dBm)</label>
            <input type="number" id="power" value="30" step="1">
          </div>
          <div class="form-group">
            <label for="height">Antenna Height (m)</label>
            <input type="number" id="height" value="10" step="1">
          </div>
          <div class="form-group">
            <label for="gain">Antenna Gain (dBi)</label>
            <input type="number" id="gain" value="12" step="0.5">
          </div>
        </div>

        <div class="btn-group">
          <button type="button" class="btn btn-primary" id="btn-submit-specs">Save & Analyze Link</button>
          <button type="button" class="btn btn-secondary" id="btn-generate-diagram">Generate Map Diagram</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Right Panel: Agent AI Assistant Chat -->
  <div class="right-panel">
    <div id="chat-log">
      <div class="msg agent">
        <div class="bubble">Welcome to TerrainComm RF Planner! Pick a location on the interactive map or enter MGRS grid coordinates to configure your transmitter parameters.</div>
      </div>
    </div>

    <form id="chat-form">
      <input id="chat-input" placeholder="Ask RF agent to compute path loss, Fresnel clearance, or AP layout..." autocomplete="off">
      <button id="chat-submit" type="submit">Send</button>
    </form>
  </div>
</div>

<script>
// --- Interactive Map Setup (Leaflet) ---
const defaultLat = 47.10190;
const defaultLon = -122.59850;
const map = L.map('map').setView([defaultLat, defaultLon], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '© OpenStreetMap contributors'
}).addTo(map);

let txMarker = L.marker([defaultLat, defaultLon], { draggable: true }).addTo(map);
txMarker.bindPopup("<b>Transmitter Station</b><br>Drag or click map to move.").openPopup();

function updateLocationInput(lat, lon) {
  // Rough MGRS display format fallback or Lat/Lon string
  const mgrsApprox = `18SUJ${Math.abs(Math.round(lon*100000)).toString().slice(-5)}${Math.abs(Math.round(lat*100000)).toString().slice(-5)}`;
  document.getElementById('location').value = `${lat.toFixed(5)}, ${lon.toFixed(5)} (${mgrsApprox})`;
}

map.on('click', (e) => {
  const { lat, lng } = e.latlng;
  txMarker.setLatLng([lat, lng]);
  updateLocationInput(lat, lng);
});

txMarker.on('dragend', () => {
  const { lat, lng } = txMarker.getLatLng();
  updateLocationInput(lat, lng);
});

// --- Chat & A2UI Renderer Setup ---
const log = document.getElementById("chat-log");
const chatForm = document.getElementById("chat-form");
const chatInput = document.getElementById("chat-input");

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function bubble(who) {
  const m = el("div", "msg " + who);
  const b = el("div", "bubble");
  m.appendChild(b);
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

// A2UI Component Renderer
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) {
  return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase();
}

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

async function sendPrompt(promptText) {
  bubble("user").textContent = promptText;
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: promptText })
    });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
}

chatForm.addEventListener("submit", (ev) => {
  ev.preventDefault();
  const text = chatInput.value.trim();
  if (!text) return;
  chatInput.value = "";
  sendPrompt(text);
});

// --- Wire Transmitter Form Buttons ---
document.getElementById("btn-submit-specs").addEventListener("click", () => {
  const loc = document.getElementById("location").value;
  const freq = document.getElementById("frequency").value;
  const pwr = document.getElementById("power").value;
  const ht = document.getElementById("height").value;
  const gain = document.getElementById("gain").value;

  const prompt = `Please record my transmitter location specs: Location=${loc}, Frequency=${freq} MHz, Tx Power=${pwr} dBm, Antenna Height=${ht} m, Antenna Gain=${gain} dBi. Calculate the Free Space Path Loss (FSPL) and Received Signal Strength (RSSI) at a distance of 5 km.`;
  sendPrompt(prompt);
});

document.getElementById("btn-generate-diagram").addEventListener("click", () => {
  const loc = document.getElementById("location").value;
  const prompt = `Generate a 2D RF coverage visual map diagram for transmitter at ${loc}.`;
  sendPrompt(prompt);
});
</script>
</body>
</html>
